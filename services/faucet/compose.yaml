services:
  faucet-bot:
    build:
      context: ../../
      dockerfile: services/Dockerfile
      args:
        SERVICE: faucet
    image: dropset-faucet
    container_name: faucet
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./faucet.toml:/app/faucet.toml:ro
      - ./faucet-keypair.json:/app/faucet-keypair.json:ro
    healthcheck:
      test: ["CMD", "/app/service", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
