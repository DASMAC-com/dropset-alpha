# dropset services
#
# To run the maker bot:
#  docker compose --profile maker up
#
# To run the taker bot:
#   docker compose --profile taker up
#
# To run the faucet:
#   docker compose --profile faucet up
#
# Config files and keypairs are mounted from the services/ directory at runtime,
# rather than being baked into the image.
#
# Each service must have a keypair at the corresponding keypair.json file:
# - maker: `services/maker-keypair.json`
# - taker: `services/taker-keypair.json`
# - faucet: `services/faucet-keypair.json`
#
# Copy the example and fill it in:
#
#   cp maker.toml.example maker.toml
#   # edit maker.toml — set oanda_auth_token, base_mint, quote_mint
#
# Build context is the workspace root (one level up from this file).
#
# network_mode: host shares the host's network stack so localhost inside the
# container resolves to the host. Requires Docker Desktop >= 4.29 on macOS.

services:

  maker-bot:
    profiles: [maker]
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: maker-bot
    image: dropset-maker-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - MAKER_CONFIG_PATH=/run/config/maker.toml
    volumes:
      - ./maker.toml:/run/config/maker.toml:ro
      - ./maker-keypair.json:/run/config/maker-keypair.json:ro

  taker-bot:
    profiles: [taker]
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: taker-bot
    image: dropset-taker-bot
    restart: unless-stopped
    network_mode: host
    environment:
      - TAKER_CONFIG_PATH=/run/config/taker.toml
    volumes:
      - ./taker.toml:/run/config/taker.toml:ro
      - ./taker-keypair.json:/run/config/taker-keypair.json:ro

  faucet:
    profiles: [faucet]
    build:
      context: ..
      dockerfile: services/Dockerfile
      args:
        SERVICE: faucet
    image: dropset-faucet
    restart: unless-stopped
    network_mode: host
    environment:
      - FAUCET_CONFIG_PATH=/run/config/faucet.toml
    volumes:
      - ./faucet.toml:/run/config/faucet.toml:ro
      - ./faucet-keypair.json:/run/config/faucet-keypair.json:ro
