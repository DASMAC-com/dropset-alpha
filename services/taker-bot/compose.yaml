services:
  taker-bot:
    build:
      context: ../../
      dockerfile: services/Dockerfile
      args:
        SERVICE: taker-bot
    image: dropset-taker-bot
    container_name: taker-bot
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./taker.toml:/app/taker.toml:ro
      - ./taker-keypair.json:/app/taker-keypair.json:ro
    healthcheck:
      test: ["CMD", "/app/service", "--health-check"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
