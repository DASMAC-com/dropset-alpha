---
jobs:
  semantic-pr:
    name: 'Validate PR title'
    runs-on: 'ubuntu-latest'
    steps:
    - name: 'Validate semantic PR title'
      uses: 'amannn/action-semantic-pull-request@v5'
      env:
        GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
name: 'Semantic PR'
'on':
  pull_request_target:
    types:
    - 'edited'
    - 'opened'
    - 'synchronize'
...
